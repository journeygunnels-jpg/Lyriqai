<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyriqai — AI Songwriting</title>
  <style>
    :root {
      --bg: #0f0e17;
      --surface: #1a1929;
      --surface-hover: #232136;
      --primary: #a78bfa;
      --primary-hover: #8b5cf6;
      --text: #e7e3f4;
      --text-muted: #9b97b0;
      --border: #2d2b3d;
      --accent: #f472b6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }
    .hero { text-align: center; margin-bottom: 2.5rem; }
    .hero h2 {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }
    .hero p { color: var(--text-muted); font-size: 1.05rem; }
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }
    .input-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-card textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.2s;
    }
    .input-card textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .type-selector {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    .type-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .type-btn:hover { border-color: var(--primary); color: var(--text); }
    .type-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .generate-btn {
      width: 100%;
      margin-top: 1.25rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      padding: 0.95rem;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .generate-btn:hover { opacity: 0.9; }
    .generate-btn:active { transform: scale(0.99); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .output {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 0.95rem;
      min-height: 100px;
      display: none;
    }
    .output.visible { display: block; }
    .output .placeholder { color: var(--text-muted); text-align: center; padding: 1.5rem 0; }
    .error {
      background: rgba(244, 114, 182, 0.1);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      color: var(--accent);
      font-size: 0.9rem;
      margin-top: 1rem;
      display: none;
    }
    .error.visible { display: block; }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      color: var(--text-muted);
      padding: 2rem 0;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>Lyriqai</h1>
    <span class="tag">Powered by Claude</span>
  </header>

  <main>
    <div class="hero">
      <h2>AI Music &amp; Songwriting</h2>
      <p>Full songs, beat sheets, and title ideas in seconds.</p>
    </div>

    <div class="input-card">
      <label for="prompt">What's your song about?</label>
      <textarea id="prompt" placeholder="e.g. late-night drive through the city, falling in love at a bookstore, overcoming self-doubt..."></textarea>

      <div class="type-selector">
        <button class="type-btn active" data-type="song">Full Song</button>
        <button class="type-btn" data-type="beat">Beat Sheet</button>
        <button class="type-btn" data-type="titles">Title Ideas</button>
      </div>

      <button class="generate-btn" id="generateBtn">Generate</button>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="output" id="output">
      <div class="placeholder">Your generated content will appear here.</div>
    </div>
  </main>

  <footer>Lyriqai — AI songwriting assistant</footer>

  <script>
    const promptEl = document.getElementById('prompt');
    const generateBtn = document.getElementById('generateBtn');
    const outputEl = document.getElementById('output');
    const errorBox = document.getElementById('errorBox');
    let selectedType = 'song';

    document.querySelectorAll('.type-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selectedType = btn.dataset.type;
      });
    });

    generateBtn.addEventListener('click', async () => {
      const prompt = promptEl.value.trim();
      if (!prompt) { promptEl.focus(); return; }

      generateBtn.disabled = true;
      errorBox.classList.remove('visible');
      outputEl.classList.add('visible');
      outputEl.innerHTML = '<div class="loading"><div class="spinner"></div> Generating...</div>';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, type: selectedType }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Generation failed');
        }
        outputEl.textContent = data.result;
      } catch (err) {
        outputEl.classList.remove('visible');
        errorBox.textContent = err.message;
        errorBox.classList.add('visible');
      } finally {
        generateBtn.disabled = false;
      }
    });

    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generateBtn.click();
    });
  </script>
</body>
</html>
